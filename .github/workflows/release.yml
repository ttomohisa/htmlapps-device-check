name: Release Device Check

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: device-check-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check version and existing tag
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [string](Get-Content -Raw -Encoding UTF8 app.config.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release requires a stable Semantic Versioning value in app.config.json: $version"
          }

          $tag = "v$version"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          # Re-running an already released version must not create another Release or move its tag.
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            "needed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "$tag already has a GitHub Release. Nothing to publish."
            exit 0
          }

          # A tag without its Release needs manual investigation, not an automatic retag.
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "$tag exists without a GitHub Release. Refusing to overwrite or silently reuse the tag."
          }

          "needed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Will publish $tag after validating the merged main commit."

      - name: Set up Node.js
        if: ${{ steps.version.outputs.needed == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build and verify standalone HTML
        if: ${{ steps.version.outputs.needed == 'true' }}
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Prepare downloadable files
        if: ${{ steps.version.outputs.needed == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item -LiteralPath dist/index.html -Destination release-assets/device-check.html
          Copy-Item -LiteralPath dist/index.self-extract.html -Destination release-assets/device-check.self-extract.html
          foreach ($file in @('device-check.html', 'device-check.self-extract.html')) {
            $path = Join-Path 'release-assets' $file
            if ((Get-Item -LiteralPath $path).Length -eq 0) {
              throw "Empty release asset: $path"
            }
          }

      - name: Create version tag and GitHub Release
        if: ${{ steps.version.outputs.needed == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          # gh creates the tag at the validated merged commit only if it does not exist.
          gh release create $env:RELEASE_TAG `
            'release-assets/device-check.html' `
            'release-assets/device-check.self-extract.html' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Device Check $env:RELEASE_TAG" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "Could not publish $env:RELEASE_TAG" }
